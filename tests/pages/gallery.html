<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>The gallery: my-3dge</title>
    <!--
      The gallery's page (PLAN.md WP 7.7): tests/pages/gallery.ts registers every lab's content and starts the engine
      on the gallery's scene, on the entry the hash names (#gallery/<kind>/<id>). Until the engine publishes
      window.__engine, the inline script below records a script that fails to load or throws, and shows it in #msg.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15171c;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      #msg {
        position: fixed;
        inset: 0;
        padding: 24px;
        font:
          16px system-ui,
          sans-serif;
        color: #c9ccd4;
        white-space: pre-line;
        pointer-events: none;
      }
      #msg[hidden] {
        display: none;
      }
    </style>
    <script>
      window.__engine = { ready: false, errors: [] };
      function galleryFailed(message) {
        if (!window.__engine || typeof window.__engine.help === 'function') return; // the engine reports now
        var fix = 'the console names the cause; node x gallery reports it headless';
        var record = { code: 'APP_START', message: 'the page failed to start: ' + message, fix: fix };
        if (window.__engine.errors.length === 0) {
          var msg = document.getElementById('msg');
          if (msg) msg.textContent = record.code + ': ' + record.message + '\nFix: ' + fix;
        }
        window.__engine.errors.push(record);
      }
      addEventListener('error', function (event) {
        galleryFailed(event.message || 'a script failed');
      });
      addEventListener('unhandledrejection', function (event) {
        galleryFailed(String((event.reason && event.reason.message) || event.reason));
      });
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="msg" role="status" aria-live="polite">Loading…</div>
    <script type="module" src="./gallery.ts" onerror="galleryFailed('tests/pages/gallery.ts did not load')"></script>
  </body>
</html>
