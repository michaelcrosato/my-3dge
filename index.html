    <!--
      The landing page (PLAN.md WP 0.12): it opens the playground (labs/playground/, the game the owner plays and
      checks; ADR-0021 amendment 3), passing on this URL's query and hash, so /?scene=gym&cam3=follow reaches the page
      that reads it. The playground's menu links the labs index and the Stress Box (labs/box/). Routing lives in
      files, not in vercel.json, so `npx vite preview` serves what Vercel serves.
    -->

      location.replace('labs/playground/' + location.search + location.hash);
    </script>

      }

      }
    </style>
