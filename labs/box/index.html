<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#15171c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="../../engine/ui/manifest.webmanifest" />
    <link rel="stylesheet" href="../../engine/ui/touch.css" />
    <link rel="icon" href="data:," />
    <title>The Stress Box: my-3dge</title>
    <!--
      The Stress Box (PLAN.md §9.0): labs/box/main.ts starts the engine on the scene ?scene names (room by default);
      labs/box/README.md says what each scene shows and how to tune it. Ready or error (§8.3): until the engine
      publishes window.__engine, the inline script below records a script that fails to load or throws, and shows
      it in #msg, so a broken page is one line of text, never a blank one. On phones (WP 3.12, built, not tested):
      a viewport that does not zoom, the engine's manifest (full screen, landscape) and engine/ui/touch.css, which
      styles the touch controls and the page in touch mode; the canvas follows the visible height (100dvh).
      The page ships the animation library's clips (clip mode, labs/box/scenes/clips.ts), so it shows the credit
      100STYLE's license (CC BY 4.0) asks for on screen, always (#credit; data/anim/SOURCES.md, PLAN.md WP 8.9): the
      title, the authors, the license with its link, the dataset's link and a note of the changes.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15171c;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        outline: none;
        touch-action: none;
        image-rendering: pixelated;
      }
      #msg {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font:
          18px system-ui,
          sans-serif;
        color: #c9ccd4;
        text-align: center;
        white-space: pre-line;
        pointer-events: none;
      }
      #msg[hidden] {
        display: none;
      }
      #credit {
        position: fixed;
        left: 8px;
        bottom: 6px;
        margin: 0;
        max-width: calc(100vw - 16px);
        font:
          11px/1.3 system-ui,
          sans-serif;
        color: #c9ccd4;
        opacity: 0.75;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #credit a {
        color: inherit;
        pointer-events: auto;
      }
    </style>
    <script>
      window.__engine = { ready: false, errors: [] };
      function boxFailed(message) {
        if (!window.__engine || typeof window.__engine.help === 'function') return; // the engine reports now
        var fix = 'the console names the cause; node x shot labs/box reports it headless';
        var record = { code: 'APP_START', message: 'the page failed to start: ' + message, fix: fix };
        if (window.__engine.errors.length === 0) {
          var msg = document.getElementById('msg');
          if (msg) msg.textContent = record.code + ': ' + record.message + '\nFix: ' + fix;
        }
        window.__engine.errors.push(record);
      }
      addEventListener('error', function (event) {
        boxFailed(event.message || 'a script failed');
      });
      addEventListener('unhandledrejection', function (event) {
        boxFailed(String((event.reason && event.reason.message) || event.reason));
      });
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="msg" role="status" aria-live="polite">Loading…</div>
    <p id="credit">
      Motion: <a href="https://zenodo.org/records/8127870" target="_blank" rel="noopener">100STYLE</a>, by Mason, Starke
      and Komura (2022),
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>; converted to
      key poses, one loop per style and gait
    </p>
    <script type="module" src="./main.ts" onerror="boxFailed('labs/box/main.ts did not load')"></script>
  </body>
</html>
