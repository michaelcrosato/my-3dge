<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#15171c" />
    <link rel="stylesheet" href="../../engine/ui/touch.css" />
    <link rel="icon" href="data:," />
    <title>The Playground: my-3dge</title>
    <!--
      The playground's page (labs/playground/README.md): labs/playground/main.ts starts the engine on the scene
      playground:gym, the menu for humans and the HUD. Ready or error: until the engine publishes window.__engine, the
      inline script below records a script that fails to load or throws, and shows it in #msg, so a broken page is one
      line of text, never a blank one; `node x shot labs/playground` reports the same headless.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #15171c;
      }
      /* A margin of two drawn pixels round the screen (engine/gfx/resolution.ts's --my3dge-pixel), drawn and hidden,
         so the pixel look's glide (a fraction of a pixel, resolution.ts shift) never shows an edge. */
      canvas {
        display: block;
        width: calc(100vw + 4 * var(--my3dge-pixel, 0px));
        height: calc(100vh + 4 * var(--my3dge-pixel, 0px));
        height: calc(100dvh + 4 * var(--my3dge-pixel, 0px));
        margin: calc(-2 * var(--my3dge-pixel, 0px));
        outline: none;
        touch-action: none;
      }
      #msg {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font:
          18px system-ui,
          sans-serif;
        color: #c9ccd4;
        text-align: center;
        white-space: pre-line;
        pointer-events: none;
      }
      #msg[hidden] {
        display: none;
      }
    </style>
    <script>
      window.__engine = { ready: false, errors: [] };
      function pageFailed(message) {
        if (!window.__engine || typeof window.__engine.help === 'function') return; // the engine reports now
        var fix = 'the console names the cause; node x shot labs/playground reports it headless';
        var record = { code: 'APP_START', message: 'the page failed to start: ' + message, fix: fix };
        if (window.__engine.errors.length === 0) {
          var msg = document.getElementById('msg');
          if (msg) msg.textContent = record.code + ': ' + record.message + '\nFix: ' + fix;
        }
        window.__engine.errors.push(record);
      }
      addEventListener('error', function (event) {
        pageFailed(event.message || 'a script failed');
      });
      addEventListener('unhandledrejection', function (event) {
        pageFailed(String((event.reason && event.reason.message) || event.reason));
      });
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="msg" role="status" aria-live="polite">Loading…</div>
    <script type="module" src="./main.ts" onerror="pageFailed('labs/playground/main.ts did not load')"></script>
  </body>
</html>
