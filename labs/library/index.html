<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Library Lab: my-3dge</title>
    <!--
      The clip library: search it, play a clip on the mannequin and the hero, read and edit its text, mirror it, step its frames.
      labs/library/main.ts starts it (PLAN.md WP 10.8). Until the engine publishes window.__engine, the inline script
      below records a script that fails to load or throws, and shows it in #msg.
    -->
    <script>
      window.__engine = { ready: false, errors: [] };
      function labFailed(message) {
        if (!window.__engine || typeof window.__engine.help === 'function') return; // the engine reports now
        var fix = 'the console names the cause; node x shot labs/library/ reports it headless';
        var record = { code: 'APP_START', message: 'the page failed to start: ' + message, fix: fix };
        if (window.__engine.errors.length === 0) {
          var msg = document.getElementById('msg');
          if (msg) {
            msg.hidden = false;
            msg.textContent = record.code + ': ' + record.message + '\nFix: ' + fix;
          }
        }
        window.__engine.errors.push(record);
      }
      addEventListener('error', function (event) {
        labFailed(event.message || 'a script failed');
      });
      addEventListener('unhandledrejection', function (event) {
        labFailed(String((event.reason && event.reason.message) || event.reason));
      });
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <aside id="lab"></aside>
    <div id="msg" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./main.ts" onerror="labFailed('labs/library/main.ts did not load')"></script>
  </body>
</html>
